<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nos Produits - Jardin Agro</title>
  
  <!-- CSS principal -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- FontAwesome pour les icônes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- EN-TÊTE / NAVBAR -->
  <header class="main-header">
    <div class="header-container">
      <a href="index.html" class="logo">
        <img src="image/logi.png" alt="Jardin Agro" onerror="this.src='image/logi.jpg'">
        <span>Jardin Agro</span>
      </a>

      <nav class="nav-menu">
        <a href="index.html">Accueil</a>
        <a href="products.html" class="active">Catalogue</a>
        <a href="index.html#services">Services</a>
        <a href="index.html#contact">Contact</a>
      </nav>

      <div class="header-actions">
        <a href="products.html" class="cart-icon"><i class="fa-solid fa-bag-shopping"></i></a>
        <button class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <!-- SECTION EN-TÊTE PAGE -->
  <section class="products-hero">
    <span class="sub-title">NOS UNIVERS FLORAUX</span>
    <h1>Tous nos Produits</h1>
    <p>Découvrez nos compositions adaptées à vos besoins et événements.</p>
  </section>

  <!-- SECTION FILTRES DE CATÉGORIES -->
  <section class="filters-container">
    <div class="filters-scroll">
      <button class="filter-btn active" data-category="all">Tous</button>
      <button class="filter-btn" data-category="hotels">Hôtels</button>
      <button class="filter-btn" data-category="entreprises">Entreprises & Banques</button>
      <button class="filter-btn" data-category="conferences">Conférences</button>
      <button class="filter-btn" data-category="mariage">Mariage & Fêtes</button>
      <button class="filter-btn" data-category="funeraire">Funéraire</button>
    </div>
  </section>

  <!-- GRILLE DES PRODUITS -->
  <section class="products-section">
    <div class="products-grid" id="productsGrid">
      <!-- Les cartes de bouquets sont chargées dynamiquement par JavaScript -->
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="main-footer">
    <div class="footer-container">
      <p>&copy; 2026 Jardin Agro. Tous droits réservés.</p>
    </div>
  </footer>

  <!-- CHARGEMENT DES SCRIPTS JS -->
  <script src="js/products.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('productsGrid');
      const filterBtns = document.querySelectorAll('.filter-btn');

      // Vérification de la présence des données de produits
      if (typeof products === 'undefined') {
        if (grid) {
          grid.innerHTML = '<p style="text-align: center; grid-column: 1/-1; padding: 40px;">Erreur de chargement des produits (js/products.js non trouvé ou invalide).</p>';
        }
        return;
      }

      // Normalisation de la catégorie d'URL (pour gérer les alias courants)
      const urlParams = new URLSearchParams(window.location.search);
      let rawCat = urlParams.get('cat') || 'all';
      
      const categoryMap = {
        'mariages': 'mariage',
        'fetes': 'mariage',
        'deuil': 'funeraire',
        'deuils': 'funeraire',
        'banques': 'entreprises'
      };

      const selectedCat = categoryMap[rawCat] || rawCat;

      function displayProducts(items) {
        if (!grid) return;
        if (!items || items.length === 0) {
          grid.innerHTML = '<p style="text-align: center; grid-column: 1/-1; padding: 40px;">Aucun produit disponible dans cette catégorie pour le moment.</p>';
          return;
        }

        grid.innerHTML = items.map(p => `
          <div class="product-card">
            <span class="badge-livrable ${p.surMesure ? 'sur-mesure' : ''}">
              <i class="fa-solid ${p.surMesure ? 'fa-pen-ruler' : 'fa-truck-fast'}"></i> 
              ${p.surMesure ? 'Sur mesure' : 'Livrable'}
            </span>
            <img src="${p.image}" alt="${p.title}" onerror="this.src='image/placeholder.jpg'">
            <div class="product-details">
              <h3>${p.title}</h3>
              <p class="price">${p.price}</p>
              <a href="product-detail.html?id=${p.id}" class="btn-discover">
                Découvrir <i class="fa-solid fa-arrow-right"></i>
              </a>
            </div>
          </div>
        `).join('');
      }

      function applyFilter(category) {
        // Mise à jour de l'état visuel des boutons
        filterBtns.forEach(btn => {
          if (btn.dataset.category === category) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        // Filtrage et affichage
        if (category === 'all') {
          displayProducts(products);
        } else {
          const filtered = products.filter(p => p.category === category);
          displayProducts(filtered);
        }
      }

      // Initialisation au chargement de la page
      applyFilter(selectedCat);

      // Gestion des clics sur les boutons de filtre
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const cat = btn.dataset.category;
          applyFilter(cat);
        });
      });
    });
  </script>
</body>
</html>
