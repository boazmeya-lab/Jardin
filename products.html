<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nos Produits - Jardin Agro</title>
  
  <!-- CSS principal -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- FontAwesome pour les icônes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- EN-TÊTE / NAVBAR -->
  <header class="main-header">
    <div class="header-container">
      <a href="index.html" class="logo">
        <img src="image/logi.png" alt="Jardin Agro" onerror="this.src='image/logi.jpg'">
        <span>Jardin Agro</span>
      </a>

      <nav class="nav-menu" id="navMenu">
        <a href="index.html">Accueil</a>
        <a href="products.html" class="active">Catalogue</a>
        <a href="index.html#services">Services</a>
        <a href="index.html#contact">Contact</a>
      </nav>

      <div class="header-actions">
        <a href="products.html" class="cart-icon"><i class="fa-solid fa-bag-shopping"></i></a>
        <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <!-- SECTION EN-TÊTE PAGE -->
  <section class="products-hero">
    <span class="sub-title">NOS UNIVERS FLORAUX</span>
    <h1 id="pageTitle">Tous nos Produits</h1>
    <p id="pageDescription">Découvrez nos compositions adaptées à vos besoins et événements.</p>
  </section>

  <!-- SECTION FILTRES DE CATÉGORIES -->
  <section class="filters-container">
    <div class="filters-scroll">
      <button class="filter-btn active" data-category="all">Tous</button>
      <button class="filter-btn" data-category="hotels">Hôtels</button>
      <button class="filter-btn" data-category="entreprises">Entreprises & Banques</button>
      <button class="filter-btn" data-category="conferences">Conférences</button>
      <button class="filter-btn" data-category="mariage">Mariage & Fêtes</button>
      <button class="filter-btn" data-category="funeraire">Funéraire</button>
    </div>
  </section>

  <!-- GRILLE DES PRODUITS -->
  <section class="products-section">
    <div class="products-grid" id="productsGrid">
      <!-- Les cartes de bouquets sont chargées dynamiquement par JavaScript -->
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="main-footer">
    <div class="footer-container">
      <p>&copy; 2026 Jardin Agro. Tous droits réservés.</p>
    </div>
  </footer>

  <!-- CHARGEMENT DES SCRIPTS JS -->
  <script src="js/products.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('productsGrid');
      const filterBtns = document.querySelectorAll('.filter-btn');
      const pageTitle = document.getElementById('pageTitle');
      const mobileMenuBtn = id = document.getElementById('mobileMenuBtn');
      const navMenu = document.getElementById('navMenu');

      // 1. GESTION DU MENU MOBILE
      if (mobileMenuBtn && navMenu) {
        mobileMenuBtn.addEventListener('click', () => {
          navMenu.classList.toggle('active');
        });
      }

      // 2. VÉRIFICATION DES DONNÉES
      if (typeof products === 'undefined' || !Array.isArray(products)) {
        if (grid) {
          grid.innerHTML = '<p style="text-align: center; grid-column: 1/-1; padding: 40px;">Impossible de charger le catalogue. Vérifiez le fichier js/products.js.</p>';
        }
        return;
      }

      // 3. MAPPING DES NOMS DE CATÉGORIES POUR LE TITRE
      const categoryTitles = {
        'all': 'Tous nos Produits',
        'hotels': 'Compositions pour Hôtels',
        'entreprises': 'Fleurs pour Entreprises & Banques',
        'conferences': 'Décorations de Conférences',
        'mariage': 'Mariage & Célébrations',
        'funeraire': 'Hommages Funéraires'
      };

      const categoryMap = {
        'hotel': 'hotels',
        'hotels': 'hotels',
        'entreprise': 'entreprises',
        'entreprises': 'entreprises',
        'banque': 'entreprises',
        'banques': 'entreprises',
        'conference': 'conferences',
        'conferences': 'conferences',
        'mariage': 'mariage',
        'mariages': 'mariage',
        'fete': 'mariage',
        'fetes': 'mariage',
        'funeraire': 'funeraire',
        'funeraires': 'funeraire',
        'deuil': 'funeraire'
      };

      // 4. RÉCUPÉRATION DU PARAMÈTRE URL
      const urlParams = new URLSearchParams(window.location.search);
      const rawCat = (urlParams.get('cat') || 'all').toLowerCase().trim();
      const targetCategory = categoryMap[rawCat] || rawCat;

      // 5. AFFICHAGE DES CARTES
      function displayProducts(items) {
        if (!grid) return;
        
        if (!items || items.length === 0) {
          grid.innerHTML = '<p style="text-align: center; grid-column: 1/-1; padding: 40px;">Aucun produit disponible dans cette catégorie pour le moment.</p>';
          return;
        }

        grid.innerHTML = items.map(p => `
          <div class="product-card">
            <span class="badge-livrable ${p.surMesure ? 'sur-mesure' : ''}">
              <i class="fa-solid ${p.surMesure ? 'fa-pen-ruler' : 'fa-truck-fast'}"></i> 
              ${p.surMesure ? 'Sur mesure' : 'Livrable'}
            </span>
            <img src="${p.image}" alt="${p.title}" onerror="this.src='image/placeholder.jpg'">
            <div class="product-details">
              <h3>${p.title}</h3>
              <p class="price">${p.price}</p>
              <a href="product-detail.html?id=${p.id}" class="btn-discover">
                Découvrir <i class="fa-solid fa-arrow-right"></i>
              </a>
            </div>
          </div>
        `).join('');
      }

      // 6. FILTRAGE ET MISE À JOUR DU TITRE
      function filterAndRender(category) {
        // Mise à jour visuelle des boutons
        filterBtns.forEach(btn => {
          if (btn.dataset.category === category) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        // Mise à jour du titre h1
        if (pageTitle && categoryTitles[category]) {
          pageTitle.textContent = categoryTitles[category];
        }

        // Filtrage des éléments
        if (category === 'all') {
          displayProducts(products);
        } else {
          const filtered = products.filter(p => p.category && p.category.toLowerCase().trim() === category);
          displayProducts(filtered);
        }
      }

      // Initialisation
      filterAndRender(targetCategory);

      // Clics sur les filtres
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const cat = btn.dataset.category;
          filterAndRender(cat);
        });
      });
    });
  </script>
</body>
</html>
