<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistant Jardin Agro</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;position:fixed;background:#f4f5f1;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#222}
#app{position:fixed;top:0;left:0;right:0;height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:#f4f5f1}
header{background:#2b5a3c;color:#fff;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px;flex-shrink:0}
header a.back{color:#fff;text-decoration:none;font-size:22px;line-height:1;padding:4px 8px}
.t{flex:1;min-width:0;line-height:1.25}
.t strong{display:block;font-family:"Playfair Display",Georgia,serif;font-size:17px}
.t span{font-size:12.5px;opacity:.85}
#msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex}
.row.user{justify-content:flex-end}
.m{max-width:82%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.bot .m{background:#fff;border:1px solid #e3e5dd;border-bottom-left-radius:5px}
.user .m{background:#2b5a3c;color:#fff;border-bottom-right-radius:5px}
.m a{font-weight:600;color:#a4162b}
.gal{display:flex;gap:6px;margin-top:10px}
.gal img{flex:1;min-width:0;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#e4e7df;cursor:pointer}
.cta{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.cta a{text-align:center;text-decoration:none;padding:11px 14px;border-radius:999px;font-size:14px}
.cta .p{background:#2b5a3c;color:#fff}
.cta .s{border:1px solid #2b5a3c;color:#2b5a3c}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{border:1px solid #2b5a3c;background:#fff;color:#2b5a3c;border-radius:999px;padding:8px 14px;font:500 13.5px inherit;font-family:inherit;cursor:pointer}
.typing{display:inline-flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:#9aa394;animation:d 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes d{0%,60%,100%{opacity:.4}30%{opacity:1}}
form{display:flex;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e3e5dd;flex-shrink:0}
input{flex:1;min-width:0;border:1px solid #d9dcd3;background:#f4f5f1;border-radius:999px;padding:12px 16px;font-size:16px;font-family:inherit;-webkit-appearance:none;outline:none}
input:focus{border-color:#2b5a3c;background:#fff}
#send{border:0;background:#a4162b;color:#fff;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer}
#send:disabled{opacity:.4}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
#zoom img{max-width:100%;max-height:100%;border-radius:12px}
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="back" href="index.html" aria-label="Retour au site">←</a>
    <div class="t"><strong>Assistant Jardin Agro</strong><span>En ligne · répond tout de suite</span></div>
  </header>
  <div id="msgs" aria-live="polite"></div>
  <form id="form" autocomplete="off">
    <input id="input" type="text" placeholder="Écrivez votre message…" aria-label="Votre message" enterkeyhint="send">
    <button id="send" type="submit" aria-label="Envoyer" disabled>➤</button>
  </form>
</div>
<script>
(function () {
  'use strict';
  var PHONE_DISPLAY = '+243 831 982 374', PHONE_TEL = '+243831982374';
  var PAGES = { bouquet: 'creer-bouquet.html', catalogue: 'products.html', livraison: 'livraison.html', contact: 'https://wa.me/243831982374' };

  var FAQ = [
    { q: 'Bonjour', k: ['bonjour', 'salut', 'coucou', 'hello', 'bonsoir', 'hola', 'hey'], a: 'Bonjour 🌸 Comment puis-je vous aider aujourd’hui ?' },
    { q: 'Comment ça va ?', k: ['ca va', 'cava', 'comment ca va', 'comment vas tu', 'comment allez vous', 'forme'], a: 'Tout va très bien, merci ! 🌿 Et vous, comment puis-je vous aider ?' },
    { q: 'Merci', k: ['merci', 'super', 'genial', 'parfait', 'top', 'remercie', 'merci beaucoup'], a: 'Avec grand plaisir ! N’hésitez pas si vous avez d’autres questions. Bonne journée 🌺' },
    { q: 'Voir des photos de bouquets', k: ['photo', 'photos', 'image', 'images', 'voir', 'montrer', 'montre', 'montrez', 'exemple', 'exemples', 'modele', 'modeles', 'catalogue', 'apercu'],
      a: 'Voici quelques-uns de nos bouquets 🌸 Retrouvez-les tous dans le <a href="' + PAGES.catalogue + '">catalogue</a>, ou créez le vôtre avec <a href="' + PAGES.bouquet + '">Créer mon bouquet</a>.',
      img: ['image/hôtel/maison5.jpg', 'image/hôtel/maison10.jpg', 'image/hôtel/maison7.jpg'] },
    { q: 'Comment passer une commande ?', k: ['commander', 'commande', 'acheter', 'achat', 'panier', 'reserver', 'passer'],
      a: 'C’est simple : choisissez vos fleurs ou bouquets dans le <a href="' + PAGES.catalogue + '">catalogue</a>, ajoutez-les au panier, puis validez votre commande. Vous pouvez aussi composer votre propre bouquet avec <a href="' + PAGES.bouquet + '">Créer mon bouquet</a>.' },
    { q: 'Je peux avoir plus d’informations sur Jardin Agro ?', k: ['jardin agro', 'information', 'informations', 'presentation', 'presenter', 'qui etes vous'],
      a: 'Jardin Agro est une entreprise spécialisée dans la vente de fleurs fraîches à Kinshasa, en République démocratique du Congo.' },
    { q: 'Quels sont les délais et zones de livraison ?', k: ['livraison', 'livrer', 'delai', 'zone', 'combien de temps', 'quand', 'recevoir', 'adresse'],
      a: 'Les délais et zones de livraison sont détaillés sur la page <a href="' + PAGES.livraison + '">Livraison</a>. Pour une livraison urgente ou une adresse particulière, notre service client vous répond rapidement.' },
    { q: 'Puis-je créer un bouquet personnalisé ?', k: ['personnalise', 'personnaliser', 'creer', 'composer', 'composition', 'sur mesure', 'choisir mes fleurs', 'ruban', 'emballage'],
      a: 'Oui ! Avec <a href="' + PAGES.bouquet + '">Créer mon bouquet</a>, vous choisissez vos fleurs et leur quantité, l’emballage et le ruban. Vous voyez l’aperçu et le prix se mettre à jour en direct.' },
    { q: 'Proposez-vous des abonnements floraux pour les entreprises ?', k: ['abonnement', 'entreprise', 'societe', 'bureau', 'professionnel', 'hotel', 'restaurant', 'regulier', 'gros', 'grossiste'],
      a: 'Oui, nous accompagnons les professionnels (bureaux, hôtels, restaurants…) avec des livraisons régulières et des ventes en gros. Contactez notre service client pour un devis adapté à vos besoins.' },
    { q: 'Faites-vous des compositions pour les cérémonies funéraires ?', k: ['funeraire', 'funerailles', 'deuil', 'enterrement', 'obseques', 'couronne', 'condoleances', 'ceremonie', 'gerbe'],
      a: 'Oui, nous réalisons des compositions pour les cérémonies funéraires (gerbes, couronnes, bouquets). Merci de nous contacter directement pour préciser vos souhaits et le délai.' },
    { q: 'Comment se passe le paiement ?', k: ['paiement', 'payer', 'prix', 'mobile money', 'carte', 'cash', 'especes', 'mpesa', 'airtel', 'orange', 'facture'],
      a: 'Les modes de paiement disponibles s’affichent lors de la validation de votre commande. Pour une question précise (facture, paiement à la livraison, commande professionnelle), contactez notre service client.' },
    { q: 'Comment conserver mes fleurs plus longtemps ?', k: ['conserver', 'conservation', 'durer', 'faner', 'fanent', 'entretien', 'entretenir', 'longtemps', 'eau', 'vase', 'fraiches', 'fraicheur', 'sechent'],
      a: '<b>Nos conseils pour des fleurs plus durables :</b><br>• Coupez 1 à 2 cm de tige en biais, à chaque changement d’eau.<br>• Utilisez un vase propre et de l’eau fraîche tous les 1 à 2 jours.<br>• Retirez les feuilles qui trempent dans l’eau.<br>• Ajoutez le sachet de nutriment fourni, s’il y en a un.<br>• Placez le bouquet loin du soleil direct, de la chaleur et des fruits mûrs.<br>• Retirez les fleurs fanées pour protéger les autres.' },
    { q: 'Comment entretenir un bouquet de roses ?', k: ['rose', 'roses', 'bouquet', 'tete qui penche', 'penchent'],
      a: 'Pour les roses : retirez les feuilles du bas, recoupez les tiges en biais et mettez-les dans de l’eau propre et fraîche. Si une tête penche, recoupez la tige et plongez-la quelques minutes dans de l’eau tiède. Gardez-les au frais, à l’écart du soleil.' },
    { q: 'Comment garder un bouquet frais pendant le transport ou avant un événement ?', k: ['transport', 'evenement', 'mariage', 'fete', 'avant', 'stocker', 'garder', 'voyage', 'frigo', 'cadeau'],
      a: 'Gardez les fleurs au frais et à l’ombre, tiges dans un peu d’eau si possible. Évitez la voiture chaude et le soleil. Pour un événement, mettez-les dans l’eau dès que vous les recevez et gardez-les dans une pièce fraîche.' },
    { q: 'Comment contacter le service client ?', k: ['contact', 'contacter', 'telephone', 'appeler', 'numero', 'joindre', 'service client', 'whatsapp', 'aide'],
      a: 'Vous pouvez joindre notre service client au <b>' + PHONE_DISPLAY + '</b>.' }
  ];
  var GREETING = 'Bonjour 🌸 Je suis l’assistant de Jardin Agro. Posez-moi une question sur les commandes, la livraison, les bouquets ou l’entretien de vos fleurs.';
  var SUGGESTIONS = ['Comment passer une commande ?', 'Délais de livraison', 'Conserver mes fleurs', 'Bouquet personnalisé', 'Voir des photos'];

  function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim(); }
  var STOP = ['le','la','les','un','une','des','de','du','et','ou','a','au','aux','en','pour','je','tu','vous','nous','mes','mon','ma','est','ce','que','qui','quoi','comment','puis','peut','peux','faire','avez','faites','proposez','y','il','ya','sur','dans','plus','quel','quels','quelle','quelles','se','passe','l','d','s'];
  function lev(a, b) {
    var m = a.length, n = b.length, i, j, d = [];
    for (i = 0; i <= m; i++) d[i] = [i];
    for (j = 1; j <= n; j++) d[0][j] = j;
    for (i = 1; i <= m; i++) for (j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    return d[m][n];
  }
  function similar(w, t) {
    if (w === t) return 1;
    if (w.length >= 5 && t.length >= 5 && (w.indexOf(t) === 0 || t.indexOf(w) === 0)) return 0.85;
    if (w.length >= 5 && t.length >= 5 && lev(w, t) <= (w.length > 7 ? 2 : 1)) return 0.7;
    return 0;
  }
  var INDEX = FAQ.map(function (it) {
    return { item: it, keys: it.k.map(norm), tokens: norm(it.q).split(' ').filter(function (w) { return w.length > 1 && STOP.indexOf(w) < 0; }) };
  });
  function answer(input) {
    var text = norm(input), words = text.split(' ').filter(function (w) { return w.length > 1 && STOP.indexOf(w) < 0; });
    if (!words.length) return null;
    var best = null, bs = 0;
    INDEX.forEach(function (e) {
      var s = 0;
      e.keys.forEach(function (k) {
        if (k.indexOf(' ') > -1) { if (text.indexOf(k) > -1) s += 3; return; }
        words.forEach(function (w) { s += 2.5 * similar(w, k); });
      });
      words.forEach(function (w) { e.tokens.forEach(function (t) { s += similar(w, t); }); });
      if (s > bs) { bs = s; best = e.item; }
    });
    return bs >= 1.5 ? best : null;
  }

  var app = document.getElementById('app'), msgs = document.getElementById('msgs'),
      input = document.getElementById('input'), send = document.getElementById('send'),
      typing = null;
  function down() { msgs.scrollTop = msgs.scrollHeight; }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function add(html, who) {
    var r = document.createElement('div'); r.className = 'row ' + who;
    var m = document.createElement('div'); m.className = 'm'; m.innerHTML = html;
    r.appendChild(m); msgs.appendChild(r); down();
    Array.prototype.forEach.call(m.querySelectorAll('img'), function (im) {
      im.addEventListener('load', down);
      im.addEventListener('error', function () { im.style.visibility = 'hidden'; console.warn('Image introuvable :', im.getAttribute('src')); });
    });
  }
  function gallery(l) { return '<div class="gal">' + l.map(function (s) { return '<img src="' + encodeURI(s) + '" alt="Bouquet Jardin Agro">'; }).join('') + '</div>'; }
  function contact() {
    return '<div class="cta"><a class="p" href="' + PAGES.contact + '" target="_blank" rel="noopener">Contacter le service client</a><a class="s" href="tel:' + PHONE_TEL + '">Appeler le ' + PHONE_DISPLAY + '</a></div>';
  }
  function botSays(html, after) {
    typing = document.createElement('div'); typing.className = 'row bot';
    typing.innerHTML = '<div class="m typing"><i></i><i></i><i></i></div>'; msgs.appendChild(typing); down();
    setTimeout(function () { typing.remove(); add(html, 'bot'); if (after) after(); }, Math.min(1400, 500 + html.replace(/<[^>]+>/g, '').length * 6));
  }
  function reply(t) {
    add(esc(t), 'user');
    var f = answer(t);
    if (f) botSays(f.a + (f.img ? gallery(f.img) : ''));
    else botSays('Je n’ai pas la réponse à cette question, mais notre service client se fera un plaisir de vous aider 🌿' + contact());
  }

  /* Clavier mobile : la page suit la zone visible */
  var raf = 0;
  function fit() {
    raf = 0;
    var v = window.visualViewport; if (!v) return;
    app.style.height = v.height + 'px';
    app.style.transform = 'translate3d(0,' + v.offsetTop + 'px,0)';
  }
  function queueFit() { if (!raf) raf = requestAnimationFrame(fit); }
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', function () { queueFit(); setTimeout(down, 60); });
    visualViewport.addEventListener('scroll', queueFit);
  }

  msgs.addEventListener('click', function (e) {
    if (e.target.tagName !== 'IMG') return;
    var z = document.createElement('div'); z.id = 'zoom'; z.innerHTML = '<img src="' + e.target.src + '" alt="">';
    z.onclick = function () { z.remove(); }; document.body.appendChild(z);
  });
  input.addEventListener('input', function () { send.disabled = !input.value.trim(); });
  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = input.value.trim(); if (!v) return;
    input.value = ''; send.disabled = true; reply(v);
  });

  botSays(GREETING, function () {
    var w = document.createElement('div'); w.className = 'sugg';
    SUGGESTIONS.forEach(function (s) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = s;
      b.onclick = function () { w.remove(); reply(s); };
      w.appendChild(b);
    });
    msgs.appendChild(w); down();
  });
})();
</script>
</body>
</html>
