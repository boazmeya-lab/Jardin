<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css?v=5.0">
<title>Créer mon bouquet — Jardin Agro</title>
<style>
  .bouquet-grid { display: flex; flex-wrap: wrap; gap: 16px; padding: 8px; }
  .bouquet-card { width: 160px; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; text-align: center; }
  .bouquet-card img { width: 100%; height: 140px; object-fit: cover; display: block; background: #f2f2f2; }
  .bouquet-card h3 { font-size: 0.95em; margin: 8px 6px 4px; }
  .bouquet-card a.btn-personnaliser {
    display: block; margin: 8px; padding: 8px; background: #2e7d32; color: #fff;
    border-radius: 6px; text-decoration: none; font-size: 0.85em;
  }
</style>
</head>
<body>

<a href="index.html">&larr; Retour</a>
<h1>Créer mon bouquet</h1>
<p>Choisissez un bouquet comme point de départ, puis personnalisez-le à votre goût.</p>

<div id="bouquetGrid" class="bouquet-grid"></div>

<script src="js/bouquets.js"></script>
<script>
  const grid = document.getElementById("bouquetGrid");
  BOUQUETS.forEach((b) => {
    const card = document.createElement("div");
    card.className = "bouquet-card";
    card.innerHTML = `
      <img src="${b.img}" alt="${b.name}" onerror="this.style.background='#eee'">
      <h3>${b.name}</h3>
      <a class="btn-personnaliser" href="personnaliser-bouquet.html?id=${b.id}">Personnaliser ce bouquet</a>
    `;
    grid.appendChild(card);
  });
</script>
</body>
</html>
